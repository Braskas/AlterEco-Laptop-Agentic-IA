<!-- @dsCard group="Écrans" height=380 subtitle="Euros gardés et impact évité, côte à côte" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: var(--space-4); }
  .wrap h2 { margin: 0; }
  .step { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--lift-sm); }
  .step p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h2 class="title">Ton Double Bonus du mois</h2>
  <div class="hk-bonus">
    <section class="hk-bonus__tile hk-bonus__tile--money" aria-label="Dans ma poche">
      <div class="hk-bonus__label">Dans ma poche</div>
      <div class="hk-bonus__num">142 €</div>
      <div class="hk-bonus__eq">dont 61 € sur ta paire de baskets</div>
    </section>
    <section class="hk-bonus__tile hk-bonus__tile--planet" aria-label="Pour la planète">
      <div class="hk-bonus__label">Pour la planète</div>
      <div class="hk-bonus__num">38 km</div>
      <div class="hk-bonus__eq">de voiture évités</div>
    </section>
  </div>
  <div class="step">
    <span class="hk-chip hk-chip--lilac">Petit pas</span>
    <p class="body">12 déjà faits. Le prochain : garder ton sac pour les courses.</p>
  </div>
</div>
</body>
</html>
