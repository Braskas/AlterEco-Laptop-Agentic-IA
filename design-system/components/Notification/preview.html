<!-- @dsCard group="Écrans" height=330 subtitle="Bons plans et petits pas, jamais de rappel de culpabilité" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  .stack { max-width: 420px; margin: 0 auto; display: grid; gap: var(--space-3); }
  .hk-notif svg { width: 44px; height: 44px; }
  .time { color: var(--ink-soft); font: 500 13px/20px var(--font-sans); }
  .head { display: flex; justify-content: space-between; gap: var(--space-3); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hk-sym" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#FF3E8E"/>
    <g fill="none" stroke="#17131F" stroke-width="30"><circle cx="186" cy="256" r="62"/><circle cx="348" cy="256" r="62"/></g>
    <g fill="#17131F"><circle cx="202" cy="256" r="22"/><circle cx="364" cy="256" r="22"/></g>
  </symbol>
</svg>
<div class="stack">
  <div class="hk-notif">
    <svg role="img" aria-label="Hooka"><use href="#hk-sym"/></svg>
    <div>
      <div class="head"><span class="hk-notif__title">Midi approche</span><span class="time">12 h</span></div>
      <div class="hk-notif__body">30 secondes pour trouver un Hook ?</div>
    </div>
  </div>
  <div class="hk-notif">
    <svg role="img" aria-label="Hooka"><use href="#hk-sym"/></svg>
    <div>
      <div class="head"><span class="hk-notif__title">Joli coup</span><span class="time">Hier</span></div>
      <div class="hk-notif__body">42 € gardés ce mois-ci, 38 km de voiture évités.</div>
    </div>
  </div>
  <div class="hk-notif">
    <svg role="img" aria-label="Hooka"><use href="#hk-sym"/></svg>
    <div>
      <div class="head"><span class="hk-notif__title">Dans La Bande</span><span class="time">Lun.</span></div>
      <div class="hk-notif__body">Inès donne un manteau taille M à 300 m. Ça t'intéresse ?</div>
    </div>
  </div>
</div>
</body>
</html>
